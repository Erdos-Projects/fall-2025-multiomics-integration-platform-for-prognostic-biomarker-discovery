name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install nbconvert==7.* jupyter pygments
      - name: Validate notebook can convert to HTML
        run: |
          jupyter nbconvert --to html notebooks/*.ipynb --output-dir reports/
